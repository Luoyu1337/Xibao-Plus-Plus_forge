name: Forge Build
on:
  push:
    branches: [ "forge-1.20.1-port" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x Forge-1.20.1/gradlew || true
      - name: Build
        working-directory: Forge-1.20.1
        run: ./gradlew build --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: Forge-1.20.1/build/libs/*.jar
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: forge-1.20.1-port-${{ github.sha }}
          release_name: forge-1.20.1-port-${{ github.sha }}
          body: Automated build from GitHub Actions
          draft: false
          prerelease: false
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Forge-1.20.1/build/libs/*.jar
          asset_name: xibao-forge-${{ github.sha }}.jar
          asset_content_type: application/java-archive
