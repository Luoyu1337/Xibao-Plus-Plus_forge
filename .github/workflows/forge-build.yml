name: Forge Build
on:
  push:
    branches: [ "forge-1.20.1-port" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x Forge-1.20.1/gradlew || true
      - name: Build
        working-directory: Forge-1.20.1
        run: ./gradlew build --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: Forge-1.20.1/build/libs/*.jar
      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
      - name: Authenticate gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      - name: Create release with gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=forge-1.20.1-port-${GITHUB_SHA:0:7}
          gh release create "$TAG" Forge-1.20.1/build/libs/*.jar --title "$TAG" --notes "Automated build from GitHub Actions"
