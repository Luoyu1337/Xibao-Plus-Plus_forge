name: Forge Build
on:
  push:
    branches: [ "forge-1.20.1-port" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
      - name: Build
        run: ./gradlew :Forge-1.20.1:build --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: Forge-1.20.1/build/libs/*.jar
