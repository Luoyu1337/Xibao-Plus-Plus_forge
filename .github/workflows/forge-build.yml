name: Forge Build
on:
  push:
    branches: [ "forge-1.20.1-port" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo with git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          rsync -a repo/ .
      - name: Install Java 17 (OpenJDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      - name: Grant execute permission for gradlew
        run: chmod +x Forge-1.20.1/gradlew || true
      - name: Build
        working-directory: Forge-1.20.1
        run: ./gradlew build --no-daemon
      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
      - name: Authenticate gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      - name: Create release with gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=forge-1.20.1-port-${GITHUB_SHA:0:7}
          gh release create "$TAG" Forge-1.20.1/build/libs/*.jar --title "$TAG" --notes "Automated build from GitHub Actions"
